server:
  port: 8080

spring:
  application:
    name: legends-and-traitors-backend
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

game:
  room:
    code-length: 6
    min-players: 4
    max-players: 8
    ttl-seconds: 1800
    kick-ban-duration-minutes: 5
    afk-threshold-seconds: 60

security:
  jwt:
    expiration-ms: 86400000 # 24 hours
