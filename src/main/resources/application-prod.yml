spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      url: ${REDIS_URL}

game:
  room:
    min-players: 4
    join-base-url: ${FRONTEND_BASE_URL}

security:
  jwt:
    secret: ${JWT_SECRET}
